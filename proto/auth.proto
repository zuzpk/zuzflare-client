syntax = "proto3";

package flare;

service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Register (RegisterRequest) returns (RegisterResponse);
}

message LoginRequest {
  string app_id = 1;
  string client_id = 2;
  string email = 3;
  string username = 4;
  string password = 5;
}

message LoginResponse {
  string user_id = 1;
  string token = 2;
  string refresh_token = 3;
  string role = 4;
  string error = 5;
  string error_description = 6;
}

message RegisterRequest {
  string app_id = 1;
  string client_id = 2;
  string email = 3;
  string username = 4;
  string password = 5;
}

message RegisterResponse {
  string user_id = 1;
  string token = 2;
  string role = 3;
  string error = 4;
  string error_description = 5;
}

message TokenRequest {
  string app_id = 1;
  string client_id = 2;
  string grant_type = 3;
  string username = 4;
  string email = 5;
  string password = 6;
  string scope = 7;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  string csrf_token = 3;
  string error = 4;
  string error_description = 5;
}

message LogoutRequest {
  string app_id = 1;
  string sid = 2;
}

message LogoutResponse {
  bool success = 1;
  string error = 2;
  string error_description = 3;
}
